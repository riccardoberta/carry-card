<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carry-Card</title>
  <meta name="description" content="A simple loyalty-card wallet.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a55c9">
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carry-Card">

  <link rel="stylesheet" href="css/app.css">

  <!-- Barcode generation (all symbologies Carry-Card supports). Self-hosted (not
       loaded from a CDN) so it's cached by the service worker and still works
       offline — this is what actually draws the barcode on the detail screen,
       which has to work with no connection. -->
  <script src="vendor/bwip-js-min.js"></script>
  <!-- Barcode scanning over the camera. Also self-hosted for the same reason —
       adding a new card shouldn't require network either. -->
  <script src="vendor/zxing-min.js"></script>
  <!-- Google Sign-In / Drive OAuth token client. Deliberately NOT self-hosted:
       sync inherently needs a live connection to Google anyway, and this script
       is meant to be loaded fresh from Google, not pinned. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
