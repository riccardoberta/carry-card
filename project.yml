name: CarryCard
options:
  bundleIdPrefix: com.riccardoberta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  CarryCard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CarryCard
    info:
      path: CarryCard/Info.plist
      properties:
        CFBundleDisplayName: Carry-Card
        NSCameraUsageDescription: Carry-Card uses the camera to scan loyalty-card barcodes.
        NSPhotoLibraryUsageDescription: Carry-Card uses your photo library to choose loyalty-card logos.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riccardoberta.CarryCard
        PRODUCT_NAME: CarryCard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    capabilities: {}

  CarryCardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CarryCardTests
    dependencies:
      - target: CarryCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riccardoberta.CarryCard.Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CarryCard:
    build:
      targets:
        CarryCard: all
        CarryCardTests: [test]
    test:
      targets:
        - CarryCardTests
    run:
      config: Debug
