[project]
name = "klarna-import"
version = "1.0.0"
description = "One-time migration tool: Klarna loyalty-card screenshots -> Carry-Card"
requires-python = ">=3.10"
dependencies = [
    "zxing-cpp>=2.2",
    "Pillow>=10.0",
]

[project.scripts]
klarna-import = "klarna_import.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["klarna_import*"]
